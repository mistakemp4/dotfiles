# ─── output ────────────────────────────────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=nvdec

profile=high-quality

# ─── scaling (Anime4K does the heavy lifting; these are the fallbacks) ─────
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# ─── motion: 164Hz panel, judder-free pans ────────────────────────────────
video-sync=display-resample
interpolation=yes
tscale=oversample

# ─── anime gradients: kill banding ────────────────────────────────────────
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=8

# ─── audio ────────────────────────────────────────────────────────────────
volume=70
volume-max=150
audio-channels=stereo
alang=jpn,ja,japanese
slang=eng,en,english

# ─── behaviour ────────────────────────────────────────────────────────────
keep-open=yes
save-position-on-quit=yes
screenshot-format=png
screenshot-png-compression=3
screenshot-directory=~/Pictures/mpv
screenshot-template=%F-%wH.%wM.%wS

# ─── osd ──────────────────────────────────────────────────────────────────
osd-font='FOT-Skip Std'
osd-font-size=32
osd-bar-h=2.2
osd-bar-w=70
osd-bar-align-y=0.88
osd-duration=1800

# palette, regenerated by noctalia on every theme change
include=~~/theme.conf
