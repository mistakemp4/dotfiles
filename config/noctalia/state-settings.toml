        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "noctalia/timer",
    "noctalia/translator",
    "seal/centered_weather",
    "dotnetrob/cat",
    "tranzem/media-lyrics",
    "seal/phan_site",
    "seal/phantom_calendar"
]

[shell]
