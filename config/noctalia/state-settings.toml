        "claude-code",
        "spicetify",
        "brave",
        "discord",
        "libreoffice",
        "micro",
        "vscode",
        "prismlauncher",
        "steam",
        "fastfetch",
        "obs",
        "zathura",
        "papirus-icons",
        "bat",
        "fzf",
        "lazygit",
        "starship"
    ]
    enable_builtin_templates = true

