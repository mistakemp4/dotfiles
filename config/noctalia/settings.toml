[theme]
builtin = "Noctalia"
custom_palette = "motherboard"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kcolorscheme", "niri", "starship", "cava" ]
    community_ids = [ "claude-code", "spicetify", "brave", "discord", "libreoffice", "vscode", "prismlauncher", "bat", "fastfetch", "fzf", "lazygit", "micro", "papirus-icons", "zathura", "obs", "steam" ]

    [theme.templates.user.niri-glow]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-glow.kdl"
output_path = "$XDG_CONFIG_HOME/niri/glow.kdl"

    [theme.templates.user.phantom-calendar-color]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/phantom-calendar-color.txt"
    output_path = "$XDG_CACHE_HOME/noctalia/phantom-calendar-color.txt"

    [theme.templates.user.alacritty-selection]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/alacritty-selection.toml"
    output_path = "$XDG_CONFIG_HOME/alacritty/themes/noctalia-selection.toml"

    [theme.templates.user.cursor-colors]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/cursor-colors.txt"
    output_path = "$XDG_CACHE_HOME/noctalia/cursor-colors.txt"
    post_hook = "python3 \"$HOME/.local/bin/noctalia-cursors.py\""

    [theme.templates.user.darkreader-colors]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/darkreader-colors.json"
    output_path = "$XDG_CACHE_HOME/noctalia/darkreader-colors.json"

    [theme.templates.user.bitwarden-colors]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/bitwarden.json"
    output_path = "$XDG_CACHE_HOME/noctalia/bitwarden-colors.json"
    post_hook = "python3 \"$HOME/.local/bin/theme_bitwarden.py\""

    [theme.templates.user.fontforge]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/fontforge.resource"
    output_path = "$XDG_CONFIG_HOME/fontforge/noctalia.resource"

    [theme.templates.user.th65-lighting]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/th65-lighting.txt"
    output_path = "$XDG_CACHE_HOME/noctalia/th65-lighting.txt"
    post_hook = "python3 \"$HOME/.local/bin/th65-lighting.py\" --quiet --file \"$HOME/.cache/noctalia/th65-lighting.txt\""

    # detached: restarts wait on other templates' hooks
    [theme.templates.user.theme-reload]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/theme-reload.txt"
    output_path = "$XDG_CACHE_HOME/noctalia/theme-reload.txt"
    post_hook = "setsid -f systemd-cat -t restart-themed-apps python3 \"$HOME/.local/bin/restart-themed-apps.py\""

[wallpaper]
directory = "~/Pictures/WallPapers"
enabled = true
transition_on_startup = true

    [wallpaper.default]
    path = "~/Pictures/WallPapers/we-3163965761.jpg"

    [wallpaper.last]
    path = "~/Pictures/WallPapers/we-3163965761.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/WallPapers/we-3163965761.jpg"

    [[wallpaper.favorite]]
    path = "~/Pictures/WallPapers/tp-wallpaper.jpg"
    theme_mode = "auto"

[widget.active_window]
