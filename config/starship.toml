"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

# colors come from the noctalia palette block noctalia appends below
[directory]
style = "bold fg:green"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
style = "fg:subtext0"
format = "[on]($style) [$symbol$branch]($style) "

[git_status]
style = "fg:blue"
format = "([$all_status$ahead_behind]($style)) "

[fill]
symbol = " "

[cmd_duration]
style = "fg:subtext0"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

