# Persona 5 Royal field calendar HUD (date, weekday, animated weather, time of day, holidays, special weather
# banners), drawn from the game's own sprites. Extract them from your own copy with
# tools/extract-game-assets.sh; they are never shipped here (Atlus material). Needs rsvg-convert (librsvg).
id = "seal/phantom_calendar"
name = "Phantom Calendar"
version = "3.1.0"
plugin_api = 26
author = "seal"
license = "MIT"
dependencies = []
tags = ["calendar", "weather", "desktop"]
icon = "calendar"
description = "Persona 5 Royal field calendar HUD from your own game files."

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "game_assets_dir"
  type = "string"
  label_key = "settings.game_assets_dir.label"
  description_key = "settings.game_assets_dir.description"
  default = "~/.local/share/p5-game-assets/dump/P5_FIELD_DAY"

  [[desktop_widget.setting]]
  key = "weekday_color"
  type = "select"
  label_key = "settings.weekday_color.label"
  default = "game"
  options = [
    { value = "game", label_key = "settings.weekday_color.options.game" },
    { value = "wallpaper", label_key = "settings.weekday_color.options.wallpaper" },
  ]

  [[desktop_widget.setting]]
  key = "black_opacity"
  type = "select"
  label_key = "settings.black_opacity.label"
  default = "0.6"
  options = [
    { value = "1", label_key = "settings.black_opacity.options.solid" },
    { value = "0.88", label_key = "settings.black_opacity.options.88" },
    { value = "0.8", label_key = "settings.black_opacity.options.80" },
    { value = "0.6", label_key = "settings.black_opacity.options.60" },
    { value = "0.4", label_key = "settings.black_opacity.options.40" },
  ]

  [[desktop_widget.setting]]
  key = "address"
  type = "string"
  label_key = "settings.address.label"
  description_key = "settings.address.description"
  default = ""

  [[desktop_widget.setting]]
  key = "preview_date"
  type = "string"
  label_key = "settings.preview_date.label"
  description_key = "settings.preview_date.description"
  default = ""

  [[desktop_widget.setting]]
  key = "preview_banner"
  type = "select"
  label_key = "settings.preview_banner.label"
  default = "none"
  options = [
    { value = "none", label_key = "settings.preview_banner.options.none" },
    { value = "typhoon", label_key = "settings.preview_banner.options.typhoon" },
    { value = "torrential_rain", label_key = "settings.preview_banner.options.torrential_rain" },
    { value = "heat_wave", label_key = "settings.preview_banner.options.heat_wave" },
    { value = "hot_night", label_key = "settings.preview_banner.options.hot_night" },
    { value = "cold_wave", label_key = "settings.preview_banner.options.cold_wave" },
    { value = "rainy_season", label_key = "settings.preview_banner.options.rainy_season" },
    { value = "pollen", label_key = "settings.preview_banner.options.pollen" },
    { value = "flu_season", label_key = "settings.preview_banner.options.flu_season" },
  ]
